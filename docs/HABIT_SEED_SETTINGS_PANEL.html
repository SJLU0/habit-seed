<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HabitSeed — 行動設定面板參考</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#303133;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;padding:24px 12px}.panel{max-width:430px;margin:auto;background:white;border:1px solid #dcdfe6;border-radius:14px;padding:24px;box-shadow:0 4px 18px #0000000a}h1{font-size:21px;margin:0 0 6px}.sub{font-size:12px;color:#909399;margin:0 0 22px}.field{margin:0 0 18px}label,.field-title{display:block;font-size:14px;font-weight:600;margin-bottom:8px}input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid #dcdfe6;border-radius:5px;font:inherit;color:inherit;background:#fff}textarea{min-height:58px;resize:vertical}.radio{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0}.radio input{accent-color:#409eff}.hint{color:#909399;font-size:12px;margin-top:5px}hr{border:0;border-top:1px solid #ebeef5;margin:22px 0}.level{margin:16px 0}.unitrow{display:flex;align-items:center;gap:12px}.unitrow input{flex:1;min-width:0}.unitrow span{min-width:35px;color:#606266}.preview{background:#f5f7fa;border-radius:8px;padding:14px;margin:20px 0}.preview p{font-size:13px;margin:8px 0}.preview-title{font-size:12px;color:#909399}button{width:100%;padding:12px;background:#409eff;color:white;border:0;border-radius:6px;font-weight:600;cursor:pointer}button:disabled{background:#a0cfff;cursor:not-allowed}.success{color:#67c23a;font-size:13px;text-align:center}.foot{font-size:12px;color:#909399;text-align:center;margin-top:14px}
</style></head><body><main class="panel"><h1>新增行動</h1><p class="sub">HabitSeed · 習慣設定</p>
<div class="field"><label for="area">習慣領域</label><input id="area" type="text" value="運動"></div>
<div class="field"><label for="activity">行動名稱</label><input id="activity" type="text" value="散步"></div>
<div class="field"><span class="field-title">完成條件類型</span><label class="radio"><input type="radio" name="type" value="quantity" checked> <span><b>次數型</b> — 用數值衡量（分鐘、次、頁、組等）</span></label><label class="radio"><input type="radio" name="type" value="action"> <span><b>行動型</b> — 完成指定的具體行動</span></label></div>
<hr><strong>設定三種完成程度</strong>
<div id="quantity-fields"><div id="quantity-levels"></div></div>
<div id="action-fields" hidden><div id="action-levels"></div></div>
<div class="preview"><div class="preview-title">完成後，使用者會看到</div><div id="preview"></div></div>
<button id="save">儲存行動設定</button><p id="status" class="success" role="status"></p><p class="foot">互動式 Wireframe · 示意用，沒有儲存至 localStorage</p></main>
<script>
const labels=['🌱 Mini｜迷你','🌿 Plus｜進階','⭐ Elite｜菁英'];const keys=['mini','plus','elite'];const quantities=['5','10','15'];const units=['分鐘','分鐘','分鐘'];const actions=['出門走一小段路','完成一次日常散步','完成一段較長的散步'];const $=id=>document.getElementById(id);
$('quantity-levels').innerHTML=labels.map((l,i)=>`<div class="level"><label for="q${i}">${l}</label><div class="unitrow"><input id="q${i}" aria-label="${l} 數值" type="number" min="0.01" step="any" value="${quantities[i]}" placeholder="例如：5"><input id="u${i}" aria-label="${l} 單位" type="text" value="${units[i]}" placeholder="例如：次、分鐘、頁、小時" maxlength="20"></div></div>`).join('');
$('action-levels').innerHTML=labels.map((l,i)=>`<div class="level"><label for="a${i}">${l}</label><textarea id="a${i}">${actions[i]}</textarea></div>`).join('');
function render(){const type=document.querySelector('input[name="type"]:checked').value;const q=type==='quantity';$('quantity-fields').hidden=!q;$('action-fields').hidden=q;$('preview').replaceChildren(...labels.map((label,i)=>{const p=document.createElement('p');p.textContent=`${label}：${q?($('q'+i).value||'—')+' '+($('u'+i).value||'（未填單位）'):($('a'+i).value||'尚未設定')}`;return p}));$('status').textContent=''}
document.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',render));document.querySelectorAll('input[name="type"]').forEach(el=>el.addEventListener('change',render));$('save').addEventListener('click',()=>{const q=document.querySelector('input[name="type"]:checked').value==='quantity';const valid=$('area').value.trim()&&$('activity').value.trim()&&(q?keys.every((_,i)=>$('q'+i).value.trim()&&Number($('q'+i).value)>0&&$('u'+i).value.trim()):keys.every((_,i)=>$('a'+i).value.trim()));$('status').textContent=valid?'設定完成（僅示意，未寫入資料）':'請填寫所有欄位；次數型的每個程度都需要數值及自訂單位';});render();
</script></body></html>
